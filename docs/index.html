<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yowes Doc Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4F46E5; --secondary:#818CF8; --accent:#EA580C;
  --bg:#EEF2FF; --card:#FFFFFF; --fg:#1E1B4B; --muted:#475569;
  --border:#C7D2FE; --ok:#059669; --bad:#DC2626;
  --r-lg:24px; --r-md:18px; --r-sm:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:'Baloo 2',cursive,sans-serif;font-size:15px;line-height:1.55;min-height:100vh;
  background-image:
    radial-gradient(320px 320px at 8% 4%, rgba(129,140,248,.25) 0%, transparent 70%),
    radial-gradient(280px 280px at 92% 12%, rgba(234,88,12,.14) 0%, transparent 70%),
    radial-gradient(300px 300px at 50% 100%, rgba(79,70,229,.12) 0%, transparent 70%)}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 64px}
h1{font-size:26px;font-weight:800;display:flex;align-items:center;gap:12px;margin:0 0 6px}
h1 small{font-size:13px;font-weight:600;color:var(--muted)}
.dot{width:16px;height:16px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  box-shadow:inset -2px -2px 5px rgba(0,0,0,.25), 3px 3px 8px rgba(79,70,229,.35)}
.sub{color:var(--muted);font-size:13.5px;font-weight:600;margin:0 0 18px}
.card{background:var(--card);border:3px solid var(--border);border-radius:var(--r-lg);
  padding:20px;margin:16px 0;
  box-shadow:inset -2px -2px 8px rgba(199,210,254,.35), 6px 6px 14px rgba(79,70,229,.12)}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px;letter-spacing:.2px}
input,select{width:100%;background:#F8FAFF;border:3px solid var(--border);border-radius:var(--r-sm);
  color:var(--fg);padding:11px 13px;font:inherit;font-weight:600;
  box-shadow:inset 2px 2px 5px rgba(199,210,254,.4)}
input:focus,select:focus{outline:none;border-color:var(--primary);
  box-shadow:inset 2px 2px 5px rgba(199,210,254,.4), 0 0 0 4px rgba(79,70,229,.15)}
.row{display:flex;gap:14px}.row>div{flex:1;min-width:0}
button{font:inherit;font-weight:800;color:#fff;border:3px solid rgba(0,0,0,.08);
  border-radius:var(--r-md);padding:13px 22px;font-size:15.5px;cursor:pointer;width:100%;margin-top:16px;
  background:var(--primary);
  box-shadow:inset -2px -3px 0 rgba(0,0,0,.18), inset 2px 3px 0 rgba(255,255,255,.25), 5px 6px 0 #A5B4FC;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease-out}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(2px);
  box-shadow:inset -2px -3px 0 rgba(0,0,0,.18), inset 2px 3px 0 rgba(255,255,255,.25), 2px 2px 0 #A5B4FC}
button:disabled{opacity:.55;cursor:wait;transform:none}
#go{background:var(--primary)}
#magic{background:var(--accent);box-shadow:inset -2px -3px 0 rgba(0,0,0,.18), inset 2px 3px 0 rgba(255,255,255,.25), 5px 6px 0 #FDBA74}
#magic:active{box-shadow:inset -2px -3px 0 rgba(0,0,0,.18), inset 2px 3px 0 rgba(255,255,255,.25), 2px 2px 0 #FDBA74}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.chip{border:3px solid var(--border);border-radius:var(--r-sm);padding:7px 14px;font-size:13px;
  font-weight:700;color:var(--muted);cursor:pointer;user-select:none;background:#F8FAFF;
  box-shadow:3px 3px 0 rgba(199,210,254,.6);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--secondary);border-color:var(--primary);color:#fff;
  box-shadow:inset -2px -2px 4px rgba(0,0,0,.15), 3px 3px 0 var(--primary)}
.msg{margin-top:14px;font-size:14px;font-weight:700;border:3px solid;border-radius:var(--r-md);padding:11px 14px;display:none}
.msg.err{background:#FEF2F2;border-color:#FECACA;color:var(--bad);display:block}
.msg.ok{background:#ECFDF5;border-color:#A7F3D0;color:var(--ok);display:block}
.results{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.results>div{background:var(--card);border:3px solid var(--border);border-radius:var(--r-md);padding:10px;
  box-shadow:inset -2px -2px 8px rgba(199,210,254,.3), 5px 5px 0 rgba(165,180,252,.5)}
.results img{width:100%;border-radius:10px;background:#fff}
.dl{display:block;text-align:center;font-size:13px;font-weight:700;color:var(--primary);margin-top:7px;text-decoration:none}
.dl:hover{text-decoration:underline}
.schoolcard{background:#FFF7ED;border:3px solid #FED7AA;border-radius:var(--r-md);
  padding:12px 15px;margin-top:12px;font-size:14px;grid-column:1/-1;
  box-shadow:inset -2px -2px 6px rgba(253,186,116,.25), 4px 4px 0 rgba(253,186,116,.5)}
.schoolcard b{color:#9A3412;font-size:15px}
.schoolcard .k{color:#7C2D12;font-weight:600}
footer{color:var(--muted);font-size:12.5px;font-weight:600;text-align:center;margin-top:28px}
.api{display:flex;gap:10px;align-items:stretch;margin-bottom:4px}
.api input{flex:1;font-size:13px}
.api button{width:auto;margin:0;padding:10px 16px;font-size:13px}
@media(max-width:560px){.results{grid-template-columns:1fr}.row{flex-direction:column;gap:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">
<h1><span class="dot"></span>Yowes Doc Generator <small>· web UI</small></h1>
<p class="sub">Generator dokumen edukasi — pilih negara, sekolah, isi profil, jadi.</p>

<div class="card">
  <label>Alamat server API (VPS)</label>
  <div class="api"><input id="api" value="https://213.163.196.178.sslip.io" placeholder="https://213.163.196.178.sslip.io"><button onclick="setApi()">Simpan</button></div>
</div>

<div class="card">
  <label>Negara</label><select id="country"><option value="">memuat…</option></select>
  <label>Jenis dokumen (klik untuk pilih/batal)</label><div class="chips" id="doctypes"></div>
  <label>Sekolah (pilih dari daftar)</label><select id="school"><option value="">pilih negara dulu…</option></select>
  <div id="schoolinfo"></div>
  <div class="row">
    <div><label>Nama depan</label><input id="first" placeholder="Budi"></div>
    <div><label>Nama belakang</label><input id="last" placeholder="Santoso"></div>
  </div>
  <div class="row">
    <div><label>Posisi / Jabatan</label><input id="pos" placeholder="Guru Matematika"></div>
    <div><label>Tanggal lahir (tampil di kartu) <a href="#" id="dobrand" style="color:var(--accent);font-weight:700">🎲 random</a></label><input id="dob" placeholder="12 May 1990"></div>
  </div>
  <label>Gender foto</label>
  <select id="gender"><option>Random</option><option>Male</option><option>Female</option></select>
  <button id="go">⚡ Generate Dokumen</button>
  <button id="magic">🪄 Auto Magic — kenali nama & generate otomatis</button>
  <div class="msg" id="msg"></div>
</div>

<div class="results" id="results"></div>
<footer>Yowes Web UI · frontend: GitHub Pages · engine: VPS<br>Untuk keperluan fiksi/kreatif/test saja.</footer>
</div>
<script>
let API=localStorage.getItem('yowes_api')||'https://213.163.196.178.sslip.io';
let COUNTRIES=[];
const $=id=>document.getElementById(id);
function setApi(){API=$('api').value.trim().replace(/\/+$/,'');localStorage.setItem('yowes_api',API);init()}
async function j(url,opt){const r=await fetch(url,opt);if(!r.ok){let e;try{e=(await r.json()).detail}catch(_){e=r.statusText}throw new Error(e)}return r.json()}
async function init(){
  $('api').value=API;
  $('country').innerHTML='<option value="">memuat…</option>';
  try{
    COUNTRIES=await j(API+'/api/countries');
    $('country').innerHTML='<option value="">— pilih negara —</option>'+COUNTRIES.map(c=>`<option value="${c.code}">${c.name}</option>`).join('');
  }catch(e){$('country').innerHTML='<option value="">❌ server tak terjangkau</option>'}
}
async function pickCountry(){
  const code=$('country').value; $('results').innerHTML='';
  if(!code){$('school').innerHTML='<option value="">pilih negara dulu…</option>';return}
  const c=COUNTRIES.find(x=>x.code===code);
  $('doctypes').innerHTML=c.document_types.map(d=>`<span class="chip on" data-d="${d}">${d.replaceAll('_',' ')}</span>`).join('')+`<span class="chip" data-d="__all__">pilih semua</span>`;
  document.querySelectorAll('#doctypes .chip').forEach(ch=>ch.onclick=()=>{
    if(ch.dataset.d==='__all__'){const all=[...document.querySelectorAll('#doctypes .chip')].filter(x=>x.dataset.d!=='__all__');
      const on=all[0].classList.contains('on'); all.forEach(x=>x.classList.toggle('on',!on));}
    else ch.classList.toggle('on');
  });
  const schools=await j(API+'/api/schools?country='+code);
  $('school').innerHTML=schools.map(s=>`<option value="${s.name}">${s.name} — ${s.town||s.city||''}</option>`).join('');
  showSchoolInfo();
}
function schoolInfoHTML(s){
  const parts=[s.address, s.city||s.town, s.province||s.state||s.region, s.postcode||s.zip].filter(Boolean);
  return `<div class="schoolcard">🏫 <b>${s.name}</b>${parts.length?`<br><span class="k">${parts.join(', ')}</span>`:''}</div>`;
}
async function showSchoolInfo(){
  const code=$('country').value, name=$('school').value, box=$('schoolinfo');
  if(!code||!name){box.innerHTML='';return}
  try{
    const schools=await j(API+'/api/schools?country='+code);
    const s=schools.find(x=>x.name===name);
    box.innerHTML=s?schoolInfoHTML(s):'';
  }catch(e){box.innerHTML=''}
}
$('school').onchange=showSchoolInfo;
$('country').onchange=pickCountry;
$('dobrand').onclick=e=>{e.preventDefault();
  const m=["January","February","March","April","May","June","July","August","September","October","November","December"];
  $('dob').value=(1+Math.floor(Math.random()*28))+' '+m[Math.floor(Math.random()*12)]+' '+(1970+Math.floor(Math.random()*31));
};
$('magic').onclick=async()=>{
  const btn=$('magic'),msg=$('msg');
  if(!$('first').value.trim()||!$('last').value.trim()){msg.className='msg err';msg.textContent='Isi nama depan & belakang dulu.';return}
  btn.disabled=true;msg.className='msg ok';msg.textContent='🪄 Menganalisis nama…';$('results').innerHTML='';
  try{
    const res=await j(API+'/api/resolve',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({first_name:$('first').value.trim(),last_name:$('last').value.trim(),gender:'Random'})});
    $('country').value=res.country; await pickCountry();
    $('pos').value=res.profile.position; $('dob').value=res.profile.date_of_birth;
    $('gender').value=res.profile.gender; $('school').value=res.profile.school_name;
    await showSchoolInfo();
    const p=res.matched?`cocok ${res.country_name} (skor ${res.match_score})`:`tidak ada yang cocok — fallback: ${res.country_name}`;
    msg.textContent=`🪄 ${p} — generate: ${res.profile.position} @ ${res.profile.school_name} …`;
    await new Promise(r=>setTimeout(r,600));
    const gres=await j(API+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      country:res.country,first_name:$('first').value.trim(),last_name:$('last').value.trim(),
      school_name:res.profile.school_name,position:res.profile.position,
      date_of_birth:res.profile.date_of_birth,gender:res.profile.gender,
      document_types:res.document_types})});
    msg.className='msg ok';msg.textContent=`✅ ${gres.files.length} dokumen dibuat · ${res.country_name} · ${gres.school}`;
    $('results').innerHTML=gres.files.map(f=>`<div><img src="${API}/files/${f}" loading="lazy"><a class="dl" href="${API}/files/${f}" download>⬇ download ${f.split('_')[1].replaceAll('_',' ')}</a></div>`).join('');
  }catch(e){msg.className='msg err';msg.textContent='❌ '+e.message}
  btn.disabled=false;
};
$('go').onclick=async()=>{
  const btn=$('go'),msg=$('msg');
  const types=[...document.querySelectorAll('#doctypes .chip.on')].map(x=>x.dataset.d).filter(d=>d!=='__all__');
  if(!$('country').value||!$('school').value||!$('first').value||!$('last').value||!$('pos').value){msg.className='msg err';msg.textContent='Lengkapi dulu: negara, sekolah, nama, posisi.';return}
  btn.disabled=true;msg.className='msg';msg.style.display='none';$('results').innerHTML='';
  try{
    const res=await j(API+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      country:$('country').value,first_name:$('first').value.trim(),last_name:$('last').value.trim(),
      school_name:$('school').value,position:$('pos').value.trim(),date_of_birth:$('dob').value.trim()||'—',
      gender:$('gender').value,document_types:types.length?types:null})});
    msg.className='msg ok';msg.textContent=`✅ ${res.files.length} dokumen dibuat · sekolah: ${res.school}`;
    $('results').innerHTML=res.files.map(f=>`<div><img src="${API}/files/${f}" loading="lazy"><a class="dl" href="${API}/files/${f}" download>⬇ download ${f.split('_')[1].replaceAll('_',' ')}</a></div>`).join('');
  }catch(e){msg.className='msg err';msg.textContent='❌ '+e.message}
  btn.disabled=false;
};
init();
</script></body></html>
